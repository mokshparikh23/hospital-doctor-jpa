spring.application.name=healthcare-jpa

spring.datasource.url=jdbc:h2:mem:healthcare;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# RFC 7807 error bodies for validation / missing-parameter errors
spring.mvc.problemdetails.enabled=true

# Browse the in-memory DB at http://localhost:8080/h2-console (JDBC URL above)
spring.h2.console.enabled=true
